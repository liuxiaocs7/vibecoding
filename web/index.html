<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <title>Vibecoding Dashboard - AI Autonomous Engineering</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Noto+Sans+SC:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
      html, body {
        margin: 0;
        height: 100%;
        background: #0b1220;
      }
      #boot-splash {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 16px;
        background: #0b1220;
        color: #e2e8f0;
        font-family: "Plus Jakarta Sans", "Noto Sans SC", system-ui, sans-serif;
        user-select: none;
      }
      #boot-splash img {
        width: 72px;
        height: 72px;
        object-fit: contain;
      }
      #boot-splash .boot-title {
        font-size: 18px;
        font-weight: 700;
        letter-spacing: -0.02em;
      }
      #boot-splash .boot-sub {
        font-size: 12px;
        opacity: 0.55;
        font-family: "JetBrains Mono", ui-monospace, monospace;
        letter-spacing: 0.12em;
        text-transform: uppercase;
      }
    </style>
  </head>
  <body>
    <div id="boot-splash" aria-busy="true" aria-live="polite">
      <img src="/logo-mark.png" alt="Vibecoding" />
      <div class="boot-title">Vibecoding</div>
      <div class="boot-sub">starting</div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
